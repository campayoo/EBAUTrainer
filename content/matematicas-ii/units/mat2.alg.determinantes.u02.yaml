# Clase completa: Propiedades de los determinantes y desarrollo por adjuntos
id: mat2.alg.determinantes.u02
objectives:
  - Aplicar las propiedades de los determinantes para calcular sin hacer cuentas largas.
  - Calcular menores complementarios y adjuntos.
  - Desarrollar un determinante por la fila o columna más cómoda (también de orden 4).

explanation:
  - title: Propiedades que ahorran tiempo
    body: |
      Para una matriz cuadrada $A$ de orden $n$:
      1. $|A^t| = |A|$.
      2. Si **intercambias dos filas**, el determinante **cambia de signo**.
      3. Si hay una **fila de ceros** o **dos filas proporcionales**, $|A| = 0$.
      4. Si multiplicas **una fila** por $k$, el determinante se multiplica por $k$. Por eso $|kA| = k^n|A|$.
      5. Si a una fila le **sumas** un múltiplo de otra, el determinante **no cambia**. (¡Es la clave para hacer ceros!)
      6. $|A\cdot B| = |A|\cdot|B|$ y, por tanto, $|A^{-1}| = \dfrac{1}{|A|}$.
      Todo lo dicho para filas vale también para columnas.
  - title: Menor complementario y adjunto
    body: |
      El **menor complementario** $M_{ij}$ es el determinante que queda al **tachar la fila $i$ y la columna $j$**.

      El **adjunto** es ese menor con un signo: $A_{ij} = (-1)^{i+j}M_{ij}$. Los signos forman un tablero de ajedrez:
      $$\begin{pmatrix} + & - & + \\ - & + & - \\ + & - & + \end{pmatrix}$$
  - title: Desarrollo por una fila o columna
    body: |
      El determinante es la suma de los elementos de **cualquier** fila (o columna) multiplicados por sus adjuntos:
      $$|A| = a_{i1}A_{i1} + a_{i2}A_{i2} + \dots + a_{in}A_{in}$$
      Elige siempre la fila o columna con **más ceros**: los términos con un 0 desaparecen. Así se calculan los determinantes de orden 4: primero haces ceros con la propiedad 5 y después desarrollas.
  - title: Matrices triangulares
    body: |
      Si una matriz es triangular (o diagonal), su determinante es el **producto de la diagonal principal**. Desarróllalo por la primera columna y verás por qué.

examples:
  - title: Un determinante de orden 4
    statement: 'Calcula $\begin{vmatrix} 2 & 0 & 1 & 3 \\ 1 & 0 & 0 & 2 \\ 0 & 1 & 4 & 1 \\ 3 & 0 & 2 & 1 \end{vmatrix}$.'
    steps:
      - |
        **Elegimos la columna 2**: solo tiene un elemento distinto de 0, el $a_{32} = 1$.
      - |
        **Signo del adjunto:** $(-1)^{3+2} = -1$. Tachamos la fila 3 y la columna 2:
        $$|A| = 1\cdot(-1)\cdot\begin{vmatrix} 2 & 1 & 3 \\ 1 & 0 & 2 \\ 3 & 2 & 1 \end{vmatrix}$$
      - |
        **Sarrus:** suman $0 + 6 + 6 = 12$; restan $0 + 8 + 1 = 9$. El menor vale $3$.
      - |
        **Resultado:** $|A| = -1\cdot 3 = -3$.
    result: 'Elegir bien la columna convierte un determinante de orden 4 en uno de orden 3.'

practice:
  - id: mat2.alg.determinantes.u02.p1
    kind: numeric
    statement: '$A$ es una matriz de orden 3 con $|A| = 5$. Calcula $|3A|$.'
    answer:
      value: 135
      tolerance: { absolute: 0 }
      commonErrors:
        - { value: 15, message: 'El 3 multiplica a las tres filas: $|3A| = 3^3|A|$.' }
    check: '3**3 * 5'
    hints: ['Multiplicar la matriz por 3 es multiplicar cada una de sus filas por 3.', 'Cada fila multiplicada por 3 multiplica el determinante por 3.', '$|kA| = k^n|A|$ con $n = 3$.']
    solution: '$|3A| = 3^3\cdot5 = 27\cdot5 = \boxed{135}$'
  - id: mat2.alg.determinantes.u02.p2
    kind: numeric
    statement: 'Calcula el adjunto $A_{12}$ de la matriz $A = \begin{pmatrix} 1 & 2 & 3 \\ 4 & 5 & 6 \\ 7 & 8 & 10 \end{pmatrix}$.'
    answer:
      value: 2
      tolerance: { absolute: 0 }
      commonErrors:
        - { value: -2, message: 'Ese es el menor $M_{12}$. Falta el signo $(-1)^{1+2} = -1$.' }
    check: '(-1)**(1+2) * (4*10 - 6*7)'
    hints: ['Tacha la fila 1 y la columna 2.', '$M_{12} = \begin{vmatrix} 4 & 6 \\ 7 & 10 \end{vmatrix}$', 'No olvides el signo $(-1)^{1+2}$.']
    solution: '$M_{12} = 40 - 42 = -2$, y $A_{12} = (-1)^{3}\cdot(-2) = \boxed{2}$.'
  - id: mat2.alg.determinantes.u02.p3
    kind: choice
    statement: 'Si $|A| = 4$ y $B$ se obtiene intercambiando dos filas de $A$, ¿cuánto vale $|B|$?'
    options:
      - { text: '$-4$' }
      - { text: '$4$', why: 'Intercambiar dos filas cambia el signo del determinante.' }
      - { text: '$0$', why: 'Valdría 0 si las filas fueran iguales o proporcionales.' }
      - { text: '$16$', why: 'Intercambiar filas no eleva al cuadrado.' }
    correct: 0
    hints: ['Es una de las propiedades de los determinantes.', 'Piensa en Sarrus: los productos que suman pasan a restar.', 'Intercambiar dos filas cambia el signo.']
    solution: '$|B| = -|A| = -4$.'
  - id: mat2.alg.determinantes.u02.p4
    kind: numeric
    statement: 'Calcula $\begin{vmatrix} 1 & 0 & 0 & 0 \\ 2 & 3 & 0 & 0 \\ 4 & 5 & -1 & 0 \\ 6 & 7 & 8 & 2 \end{vmatrix}$.'
    answer: { value: -6, tolerance: { absolute: 0 } }
    check: '1*3*(-1)*2'
    hints: ['Fíjate en dónde están los ceros.', 'Es una matriz triangular inferior.', 'Su determinante es el producto de la diagonal.']
    solution: 'Es triangular: $|A| = 1\cdot3\cdot(-1)\cdot2 = \boxed{-6}$.'

test:
  - id: mat2.alg.determinantes.u02.t1
    kind: numeric
    statement: '$A$ y $B$ son matrices de orden 3 con $|A| = 2$ y $|B| = -3$. Calcula $|A\cdot B^t|$.'
    answer: { value: -6, tolerance: { absolute: 0 } }
    check: '2 * (-3)'
    hints: ['El determinante de un producto es el producto de los determinantes.', '$|B^t| = |B|$', '$|A\cdot B^t| = |A|\cdot|B^t|$']
    solution: '$|A\cdot B^t| = |A|\cdot|B| = 2\cdot(-3) = \boxed{-6}$'
  - id: mat2.alg.determinantes.u02.t2
    kind: numeric
    statement: 'Calcula $\begin{vmatrix} 1 & 2 & 0 & 1 \\ 0 & 1 & 0 & 3 \\ 2 & 1 & 5 & 0 \\ 1 & 0 & 0 & 2 \end{vmatrix}$.'
    answer: { value: 35, tolerance: { absolute: 0 } }
    check: '5 * (1*1*2 + 2*3*1 + 1*0*0 - (1*1*1 + 1*3*0 + 2*0*2))'
    hints: ['Busca la columna con más ceros.', 'La columna 3 solo tiene un elemento no nulo: $a_{33} = 5$, con signo $(-1)^{3+3} = +1$.', 'Tacha la fila 3 y la columna 3 y calcula el menor con Sarrus.']
    solution: 'Desarrollando por la columna 3: $|A| = 5\cdot\begin{vmatrix} 1 & 2 & 1 \\ 0 & 1 & 3 \\ 1 & 0 & 2 \end{vmatrix} = 5\cdot(8 - 1) = \boxed{35}$.'
  - id: mat2.alg.determinantes.u02.t3
    kind: choice
    statement: 'Si dos filas de una matriz cuadrada son proporcionales, su determinante...'
    options:
      - { text: 'vale 0' }
      - { text: 'cambia de signo', why: 'Eso ocurre al intercambiar filas.' }
      - { text: 'se multiplica por la constante de proporcionalidad', why: 'Eso pasa al multiplicar UNA fila por un número.' }
      - { text: 'vale 1', why: 'Las filas son linealmente dependientes.' }
    correct: 0
    hints: ['Las filas proporcionales son linealmente dependientes.', 'Resta a una fila $k$ veces la otra (no cambia el determinante).', 'Obtienes una fila de ceros.']
    solution: 'Restando a una de ellas $k$ veces la otra aparece una fila de ceros, así que el determinante vale **0**.'

summary:
  - 'Intercambiar filas cambia el signo; sumar a una fila un múltiplo de otra no cambia nada.'
  - '$|kA| = k^n|A|$, $|AB| = |A||B|$, $|A^t| = |A|$.'
  - 'Adjunto: $A_{ij} = (-1)^{i+j}M_{ij}$. Desarrolla por la línea con más ceros.'
  - 'Triangular: producto de la diagonal.'
common_errors:
  - 'Escribir $|kA| = k|A|$.'
  - 'Olvidar el signo $(-1)^{i+j}$ del adjunto.'
  - 'Desarrollar por una fila sin ceros y perderse en las cuentas.'
