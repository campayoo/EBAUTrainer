# Clase completa: Tipos de matrices y operaciones
# Campo `check` (opcional): expresión que el validador evalúa para comprobar
# que `answer.value` es correcto. Así no se cuelan errores de cálculo.
id: mat2.alg.matrices.u01
objectives:
  - Reconocer la dimensión de una matriz y localizar sus elementos.
  - Distinguir los tipos de matrices más habituales.
  - Sumar matrices, multiplicarlas por un número y trasponerlas.

explanation:
  - title: ¿Qué es una matriz?
    body: |
      Una **matriz** es una tabla de números ordenados en **filas** y **columnas**. Si tiene $m$ filas y $n$ columnas, decimos que su **dimensión** es $m\times n$ (se lee "m por n").

      $$A = \begin{pmatrix} 1 & -2 & 0 \\ 4 & 3 & 5 \end{pmatrix} \quad\text{es de dimensión } 2\times3$$

      Cada número es un **elemento** y se nombra con dos subíndices: $a_{ij}$ es el que está en la **fila $i$** y la **columna $j$**. En el ejemplo, $a_{12} = -2$ y $a_{23} = 5$.

      Truco para no liarte: primero la fila (horizontal) y luego la columna (vertical), igual que en `matriz[fila][columna]` en programación.
  - title: Tipos de matrices
    body: |
      - **Cuadrada**: tiene tantas filas como columnas ($n\times n$). Su **diagonal principal** son los elementos $a_{11}, a_{22}, \dots, a_{nn}$.
      - **Fila** ($1\times n$) y **columna** ($m\times 1$).
      - **Nula**: todos sus elementos son 0.
      - **Diagonal**: cuadrada con ceros fuera de la diagonal principal.
      - **Identidad** $I$: diagonal con unos en la diagonal. Es el "1" de las matrices.
      - **Triangular** superior (o inferior): ceros por debajo (o por encima) de la diagonal.
      - **Simétrica**: cuadrada que coincide con su traspuesta, $A^t = A$.
  - title: Suma y producto por un número
    body: |
      Solo se pueden **sumar** matrices de la **misma dimensión**, y se suman elemento a elemento:
      $$\begin{pmatrix} 1 & 2 \\ 3 & 4 \end{pmatrix} + \begin{pmatrix} 5 & -1 \\ 0 & 2 \end{pmatrix} = \begin{pmatrix} 6 & 1 \\ 3 & 6 \end{pmatrix}$$

      Para multiplicar una matriz por un **número** $\lambda$, se multiplica **cada elemento**:
      $$3\begin{pmatrix} 1 & -2 \\ 0 & 4 \end{pmatrix} = \begin{pmatrix} 3 & -6 \\ 0 & 12 \end{pmatrix}$$
  - title: La matriz traspuesta
    body: |
      La **traspuesta** $A^t$ se obtiene cambiando filas por columnas: la fila 1 pasa a ser la columna 1, y así sucesivamente. Si $A$ es $m\times n$, $A^t$ es $n\times m$.
      $$A = \begin{pmatrix} 1 & -2 & 0 \\ 4 & 3 & 5 \end{pmatrix} \Rightarrow A^t = \begin{pmatrix} 1 & 4 \\ -2 & 3 \\ 0 & 5 \end{pmatrix}$$

      Propiedades útiles: $(A^t)^t = A$ y $(A + B)^t = A^t + B^t$.

examples:
  - title: Una combinación con traspuesta
    statement: |
      Con $A = \begin{pmatrix} 1 & -2 \\ 3 & 0 \end{pmatrix}$ y $B = \begin{pmatrix} 4 & 1 \\ -1 & 2 \end{pmatrix}$, calcula $2A - B^t$.
    steps:
      - |
        **Paso 1. Traspuesta de $B$.** Cambiamos filas por columnas: $B^t = \begin{pmatrix} 4 & -1 \\ 1 & 2 \end{pmatrix}$.
      - |
        **Paso 2. Producto por 2.** $2A = \begin{pmatrix} 2 & -4 \\ 6 & 0 \end{pmatrix}$.
      - |
        **Paso 3. Resta elemento a elemento.**
        $$2A - B^t = \begin{pmatrix} 2-4 & -4-(-1) \\ 6-1 & 0-2 \end{pmatrix} = \begin{pmatrix} -2 & -3 \\ 5 & -2 \end{pmatrix}$$
    result: 'Cuidado con los signos al restar números negativos: $-4 - (-1) = -3$.'

practice:
  - id: mat2.alg.matrices.u01.p1
    kind: choice
    statement: '¿Qué dimensión tiene $A = \begin{pmatrix} 1 & 0 & 2 \\ 3 & -1 & 4 \end{pmatrix}$?'
    options:
      - { text: '$2\times3$' }
      - { text: '$3\times2$', why: 'Primero se cuentan las filas (horizontales) y después las columnas.' }
      - { text: '$6$', why: 'Hay 6 elementos, pero la dimensión se expresa como filas × columnas.' }
      - { text: '$2\times2$', why: 'Cuenta otra vez las columnas.' }
    correct: 0
    hints:
      - 'La dimensión se escribe "filas × columnas".'
      - 'Las filas son horizontales; las columnas, verticales.'
      - 'Tiene 2 filas. ¿Cuántos números hay en cada fila?'
    solution: 'Tiene 2 filas y 3 columnas: es de dimensión $2\times3$.'
  - id: mat2.alg.matrices.u01.p2
    kind: numeric
    statement: |
      Sean $A = \begin{pmatrix} 2 & -1 \\ 0 & 3 \end{pmatrix}$ y $B = \begin{pmatrix} 1 & 4 \\ -2 & 5 \end{pmatrix}$. Calcula el elemento $c_{12}$ de $C = 3A + 2B$.
    answer: { value: 5, tolerance: { absolute: 0 } }
    check: '3*(-1) + 2*4'
    hints:
      - 'No hace falta calcular toda la matriz: solo el elemento de la fila 1, columna 2.'
      - '$c_{12} = 3\,a_{12} + 2\,b_{12}$'
      - '$a_{12} = -1$ y $b_{12} = 4$.'
    solution: '$c_{12} = 3\cdot(-1) + 2\cdot4 = -3 + 8 = \boxed{5}$'
  - id: mat2.alg.matrices.u01.p3
    kind: numeric
    statement: |
      Si $A = \begin{pmatrix} 5 & 7 & -2 \\ 1 & 0 & 3 \end{pmatrix}$, ¿cuánto vale el elemento de la fila 2 y columna 1 de $A^t$?
    answer: { value: 7, tolerance: { absolute: 0 } }
    check: '7'
    hints:
      - 'Al trasponer, la fila $i$ pasa a ser la columna $i$.'
      - 'El elemento $(i, j)$ de $A^t$ es el elemento $(j, i)$ de $A$.'
      - 'Busca el elemento $a_{12}$ de $A$.'
    solution: '$(A^t)_{21} = a_{12} = \boxed{7}$'

test:
  - id: mat2.alg.matrices.u01.t1
    kind: choice
    statement: 'Una matriz cuadrada $A$ es **simétrica** si...'
    options:
      - { text: '$A^t = A$' }
      - { text: '$A^t = -A$', why: 'Esa es la definición de matriz antisimétrica.' }
      - { text: 'todos sus elementos son iguales', why: 'No: basta con que $a_{ij} = a_{ji}$.' }
      - { text: 'su diagonal principal es nula', why: 'Eso no tiene que ver con la simetría.' }
    correct: 0
    hints: ['Piensa en un espejo situado en la diagonal principal.', 'Simétrica: $a_{ij} = a_{ji}$.', 'Eso equivale a decir que coincide con su traspuesta.']
    solution: 'Simétrica significa $a_{ij} = a_{ji}$ para todo $i, j$, es decir, $A^t = A$.'
  - id: mat2.alg.matrices.u01.t2
    kind: numeric
    statement: |
      Con $A = \begin{pmatrix} 3 & 1 \\ -2 & 4 \end{pmatrix}$ y $B = \begin{pmatrix} 1 & -1 \\ 0 & 2 \end{pmatrix}$, calcula el elemento $c_{12}$ de $C = A - 2B$.
    answer: { value: 3, tolerance: { absolute: 0 } }
    check: '1 - 2*(-1)'
    hints: ['Solo necesitas los elementos de la posición (1, 2).', '$c_{12} = a_{12} - 2\,b_{12}$', '$b_{12} = -1$']
    solution: '$c_{12} = 1 - 2\cdot(-1) = \boxed{3}$'
  - id: mat2.alg.matrices.u01.t3
    kind: choice
    statement: '¿Se pueden sumar una matriz $2\times3$ y una matriz $3\times2$?'
    options:
      - { text: 'No, para sumar deben tener la misma dimensión' }
      - { text: 'Sí, siempre se pueden sumar', why: 'La suma es elemento a elemento: necesitan la misma forma.' }
      - { text: 'Sí, y el resultado es $2\times2$', why: 'Eso se parece al producto, no a la suma.' }
      - { text: 'Solo si son cuadradas', why: 'Ninguna de las dos es cuadrada, y aun así el requisito es tener la misma dimensión.' }
    correct: 0
    hints: ['¿Cómo se suman dos matrices?', 'Elemento a elemento.', '¿Tienen todos los elementos de una su "pareja" en la otra?']
    solution: 'No. La suma se hace elemento a elemento y exige que ambas matrices tengan la misma dimensión.'

summary:
  - 'Dimensión = filas × columnas. $a_{ij}$: fila $i$, columna $j$.'
  - 'Suma y resta: elemento a elemento y solo con la misma dimensión.'
  - 'Producto por un número: multiplica todos los elementos.'
  - 'Traspuesta: filas ↔ columnas. Simétrica si $A^t = A$.'
common_errors:
  - 'Confundir el orden de los subíndices: $a_{ij}$ es fila $i$, columna $j$.'
  - 'Intentar sumar matrices de distinta dimensión.'
  - 'Equivocarse con el signo al restar elementos negativos.'
