# Clase completa: Discusión de sistemas con parámetros
id: mat2.alg.sistemas.u03
objectives:
  - Discutir un sistema según los valores de un parámetro.
  - Resolverlo en los casos que pide el enunciado.
explanation:
  - title: El método, paso a paso
    body: |
      Es uno de los ejercicios más típicos de la PAU. Con un sistema cuadrado (tantas ecuaciones como incógnitas):
      1. Calcula $|A|$ en función del parámetro y **factorízalo**.
      2. Halla los valores que anulan $|A|$.
      3. Para los demás valores: $\operatorname{rg}A = \operatorname{rg}A^* = n$, así que el sistema es **SCD**.
      4. **Estudia por separado** cada valor que anula el determinante: sustituye y calcula $\operatorname{rg}A$ y $\operatorname{rg}A^*$.
  - title: Consejos para factorizar
    body: |
      - Antes de desarrollar, busca filas o columnas que se parezcan: sumar todas las filas suele sacar un factor común.
      - Prueba valores sencillos ($1, -1, 2, -2$) con Ruffini para encontrar raíces.
      - Escribe el resultado factorizado, por ejemplo $(a-1)^2(a+2)$: así ves enseguida los valores críticos.
  - title: Cómo escribir la respuesta
    body: |
      Termina siempre con un resumen ordenado, por ejemplo:
      - Si $a \neq 1$ y $a \neq -2$: SCD.
      - Si $a = 1$: SCI (2 parámetros).
      - Si $a = -2$: SI.
examples:
  - title: Un sistema clásico
    statement: |
      Discute $\begin{cases} ax + y + z = 1 \\ x + ay + z = 1 \\ x + y + az = 1 \end{cases}$ según los valores de $a$.
    steps:
      - |
        **Determinante.** Sumando las tres filas a la primera aparece el factor $a + 2$, y queda $|A| = (a - 1)^2(a + 2)$.
      - |
        **Si $a \neq 1$ y $a \neq -2$:** $|A| \neq 0$, así que $\operatorname{rg}A = \operatorname{rg}A^* = 3$: **SCD**.
      - |
        **Si $a = 1$:** las tres ecuaciones son $x + y + z = 1$. Por tanto $\operatorname{rg}A = \operatorname{rg}A^* = 1 < 3$: **SCI** con 2 parámetros.
      - |
        **Si $a = -2$:** $\operatorname{rg}A = 2$ (por ejemplo, $\begin{vmatrix} -2 & 1 \\ 1 & -2 \end{vmatrix} = 3 \neq 0$). Al sumar las tres ecuaciones queda $0 = 3$, imposible, así que $\operatorname{rg}A^* = 3$: **SI**.
    result: |
      Resumen: SCD si $a \notin \{1, -2\}$; SCI si $a = 1$; SI si $a = -2$.
summary:
  - |-
    Primero $|A|$ factorizado; los valores que lo anulan se estudian uno a uno.
  - |-
    Para el resto de valores, el sistema es siempre SCD.
  - |-
    Termina con un resumen claro de todos los casos.
common_errors:
  - |-
    No estudiar por separado los valores que anulan el determinante.
  - |-
    Dividir entre una expresión con el parámetro sin comprobar si puede valer 0.
