# Clase completa: Variable aleatoria y distribución binomial
id: mat2.pro.distribuciones.u01
objectives:
  - Reconocer una distribución binomial.
  - Calcular probabilidades, media y desviación típica.
explanation:
  - title: Variable aleatoria discreta
    body: |
      Una **variable aleatoria** asigna un número a cada resultado de un experimento (por ejemplo, "número de caras"). Si toma valores aislados, es **discreta**, y se describe con su función de probabilidad $P(X = x_i)$.
      - Media: $\mu = \sum x_i\,p_i$.
      - Varianza: $\sigma^2 = \sum x_i^2\,p_i - \mu^2$.
  - title: La distribución binomial
    body: |
      $X \sim B(n, p)$ cuenta el **número de éxitos** en $n$ repeticiones **independientes** de un experimento con dos resultados (éxito con probabilidad $p$, fracaso con $q = 1 - p$):
      $$P(X = k) = \binom{n}{k}p^k q^{n-k}, \qquad \binom nk = \frac{n!}{k!\,(n-k)!}$$
      - Media: $\mu = np$.
      - Desviación típica: $\sigma = \sqrt{npq}$.
  - title: Probabilidades acumuladas
    body: |
      - "Como mucho $k$": $P(X \le k) = P(X = 0) + \dots + P(X = k)$.
      - "Al menos uno": usa el contrario, $P(X \ge 1) = 1 - P(X = 0) = 1 - q^n$.

      Antes de calcular, comprueba las condiciones: número fijo de pruebas, independencia y probabilidad de éxito constante.
examples:
  - title: Diez lanzamientos a canasta
    statement: |
      Un jugador encesta el 30 % de sus triples. Si lanza 10, calcula a) $P(X = 2)$; b) $P(X \le 1)$; c) la media.
    steps:
      - |
        **Modelo:** $X \sim B(10;\ 0{,}3)$.
      - |
        **a)** $P(X = 2) = \binom{10}{2}0{,}3^2\cdot0{,}7^8 = 45\cdot0{,}09\cdot0{,}0576 \approx 0{,}2335$.
      - |
        **b)** $P(X \le 1) = 0{,}7^{10} + 10\cdot0{,}3\cdot0{,}7^9 \approx 0{,}0282 + 0{,}1211 = 0{,}1493$.
      - |
        **c)** $\mu = np = 10\cdot0{,}3 = 3$ triples.
    result: |
      Encestar como mucho uno ocurre en casi el 15 % de las series: es poco probable, pero nada raro.
summary:
  - |-
    $B(n,p)$: $n$ pruebas independientes con probabilidad de éxito constante $p$.
  - |-
    $P(X = k) = \binom nk p^k q^{n-k}$; $\mu = np$; $\sigma = \sqrt{npq}$.
  - |-
    "Al menos uno": $1 - P(X = 0)$.
common_errors:
  - |-
    Olvidar el número combinatorio $\binom nk$.
  - |-
    Confundir "menos de 2" ($X \le 1$) con "como mucho 2" ($X \le 2$).
