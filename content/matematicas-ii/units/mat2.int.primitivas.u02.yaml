# Clase completa: Integración por partes, cambio de variable y racionales
id: mat2.int.primitivas.u02
objectives:
  - Integrar por partes y elegir bien las partes.
  - Aplicar un cambio de variable.
  - Integrar funciones racionales sencillas.
explanation:
  - title: Integración por partes
    body: |
      $$\int u\,dv = u\,v - \int v\,du$$
      Sirve para **productos** de funciones de distinto tipo. Para elegir $u$ (la parte que se deriva), la regla **ALPES** da la prioridad: **A**rcos, **L**ogaritmos, **P**olinomios, **E**xponenciales, **S**enos y cosenos.

      Ejemplos: $\int x e^x dx$ ($u = x$) y $\int \ln x\,dx$ ($u = \ln x$, $dv = dx$).
  - title: Cambio de variable
    body: |
      Si aparece una expresión "complicada" y su derivada, haz $t = g(x)$, $dt = g'(x)\,dx$, y reescribe todo en función de $t$:
      $$\int x\cos(x^2)\,dx \quad\xrightarrow{t = x^2,\ dt = 2x\,dx}\quad \frac12\int\cos t\,dt = \frac12\sin(x^2) + C$$
      Al final, **deshaz el cambio**. En una integral definida, cambia también los límites.
  - title: Funciones racionales
    body: |
      Para $\int \frac{P(x)}{Q(x)}dx$:
      1. Si el grado de $P$ es mayor o igual que el de $Q$, primero **divide**.
      2. Factoriza el denominador y descompón en **fracciones simples**:
      $$\frac{1}{x^2 - 1} = \frac{1/2}{x - 1} - \frac{1/2}{x + 1}$$
      3. Cada fracción da un logaritmo: $\int\frac{dx}{x^2 - 1} = \frac12\ln\left|\frac{x - 1}{x + 1}\right| + C$.
examples:
  - title: Dos veces por partes
    statement: |
      Calcula $\int x\,e^x\,dx$ y $\int \ln x\,dx$.
    steps:
      - |
        **Primera:** $u = x$, $dv = e^x dx$, así que $du = dx$ y $v = e^x$:
        $$\int x e^x dx = x e^x - \int e^x dx = (x - 1)e^x + C$$
      - |
        **Segunda:** $u = \ln x$, $dv = dx$, así que $du = \frac1x dx$ y $v = x$:
        $$\int \ln x\,dx = x\ln x - \int x\cdot\frac1x\,dx = x\ln x - x + C$$
      - |
        **Comprobación:** $(x\ln x - x)' = \ln x + 1 - 1 = \ln x$ ✓
    result: |
      Si al aplicar partes la nueva integral es más difícil que la original, cambia la elección de $u$.
summary:
  - |-
    Partes: $\int u\,dv = uv - \int v\,du$, con $u$ elegida por ALPES.
  - |-
    Cambio de variable: $t = g(x)$ y al final deshacer el cambio.
  - |-
    Racionales: dividir si hace falta y descomponer en fracciones simples.
common_errors:
  - |-
    Elegir $u = e^x$ en $\int x e^x$: la integral se complica.
  - |-
    Olvidar deshacer el cambio de variable.
