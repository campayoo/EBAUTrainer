# Al crear una etiqueta de versión (git tag v1.0.0 && git push --tags),
# se publica una "Release" en GitHub con Pauta.html para descargar.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Crear la release con el archivo descargable
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Pauta.html --title "Pauta $GITHUB_REF_NAME" --generate-notes
